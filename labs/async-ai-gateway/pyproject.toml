[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "async-ai-gateway"
version = "0.3.0"
description = "Production-oriented asyncio lab for a resilient AI provider gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]
observability = [
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  # configure_tracing() imports OTLPSpanExporter whenever an endpoint is set,
  # so the exporter belongs in the extra that turns tracing on — without it,
  # enabling tracing fails at the import rather than at configuration.
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
]
redis = [
  "redis>=5.2,<6.0",
]
auth = [
  "PyJWT>=2.10,<3.0",
]
load = [
  "locust>=2.32,<3.0",
]
all = [
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "redis>=5.2,<6.0",
  "PyJWT>=2.10,<3.0",
  "locust>=2.32,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 exists to catch. Ruff ships this
# setting precisely so the rule stays on for real cases.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_gateway"]
