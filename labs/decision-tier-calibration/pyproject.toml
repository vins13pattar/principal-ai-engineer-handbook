[project]
name = "decision-tier-calibration"
version = "0.1.0"
description = "Whether a decision model's probabilities can carry an escalation threshold"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Only the measure step needs these. CI never installs them.
measure = ["laya==0.4.1", "datasets>=3.0"]

[project.scripts]
decision-tier = "decision_tier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_tier"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["laya", "laya.*", "datasets"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
