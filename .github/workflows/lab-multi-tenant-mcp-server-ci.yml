name: Multi-Tenant MCP Server CI

on:
  push:
    paths:
      - "labs/multi-tenant-mcp-server/**"
      - ".github/workflows/lab-multi-tenant-mcp-server-ci.yml"
  pull_request:
    paths:
      - "labs/multi-tenant-mcp-server/**"
      - ".github/workflows/lab-multi-tenant-mcp-server-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/multi-tenant-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/multi-tenant-mcp-server/pyproject.toml
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy src
      - name: Tests
        run: pytest --maxfail=1 -q
