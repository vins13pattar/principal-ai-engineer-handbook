[project]
name = "checkpoint-cost"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["langgraph==1.2.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
