name: Async AI Gateway CI

on:
  push:
    paths:
      - "labs/async-ai-gateway/**"
      - ".github/workflows/lab-async-ai-gateway-ci.yml"
  pull_request:
    paths:
      - "labs/async-ai-gateway/**"
      - ".github/workflows/lab-async-ai-gateway-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/async-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: labs/async-ai-gateway/pyproject.toml
      - name: Install dependencies
        run: pip install -e '.[dev,observability,redis,auth]'
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy src
      - name: Tests
        run: pytest --maxfail=1 -q

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: labs/async-ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,redis,auth]'
      # `-k redis` used to select this, which matched only the fake-backed unit
      # tests in test_distributed_rate_limit.py -- so this job started a Redis
      # container and never spoke to it. It was green whether or not Redis
      # existed. Select the integration file by path, and set
      # REDIS_INTEGRATION_REQUIRED so its fixture fails rather than skips if
      # Redis is missing or unreachable.
      - name: Redis integration tests
        env:
          REDIS_URL: redis://localhost:6379/0
          REDIS_INTEGRATION_REQUIRED: "1"
        run: pytest -q tests/test_redis_integration.py
