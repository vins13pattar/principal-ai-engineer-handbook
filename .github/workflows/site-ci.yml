name: Site CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".github/workflows/site-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".github/workflows/site-ci.yml"

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck (astro check)
        run: pnpm check

      - name: Content structure
        run: pnpm lint:content

      - name: Unit tests
        run: pnpm test

  build:
    name: Build the site (includes internal link validation)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: handbook-site
          path: apps/handbook/dist
          retention-days: 7

      - name: Summarize preview build
        run: |
          echo "### Preview build ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the \`handbook-site\` artifact above and serve it locally to preview this change (e.g. \`npx serve apps/handbook/dist\`)." >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: handbook-site
          path: apps/handbook/dist

      - name: Install Playwright browsers
        run: pnpm --filter @handbook/site exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/handbook/playwright-report
          retention-days: 7
