packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - sharp
  - esbuild

# Security floors for transitive dependencies Dependabot could not lift on its
# own. Each selector matches only the vulnerable range and pins the first
# patched release in the same major, so nothing jumps a major version except
# minimatch, whose only fix is 11.x.
overrides:
  "astro@<7.3.3": "^7.4.7"
  "devalue@<5.9.3": "^5.9.3"
  "sharp@<0.35.5": "^0.35.5"
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "vite@>=8.2.0 <8.2.4": "^8.2.4"
  "zod@<4.6.6": "^4.6.6"
  "dompurify@<3.4.17": "^3.4.17"
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
  "@vitest/mocker@<4.1.12": "^4.1.12"
  "postcss-selector-parser@<6.1.5": "^6.1.5"
  "postcss-selector-parser@>=7.0.0 <7.1.6": "^7.1.6"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  # Found by `pnpm audit` (npm's advisory database), not by Dependabot.
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  "nanoid@<3.3.18": "^3.3.18"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  "smol-toml@<=1.8.0": "^1.9.0"
