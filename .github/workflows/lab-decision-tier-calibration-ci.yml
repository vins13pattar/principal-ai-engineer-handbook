name: Decision Tier Calibration CI

on:
  push:
    paths:
      - "labs/decision-tier-calibration/**"
      - ".github/workflows/lab-decision-tier-calibration-ci.yml"
  pull_request:
    paths:
      - "labs/decision-tier-calibration/**"
      - ".github/workflows/lab-decision-tier-calibration-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: labs/decision-tier-calibration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        # dev only: the measure extra (torch, laya) is never installed in CI.
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: ruff
        run: ./.venv/bin/python -m ruff check .
      - name: mypy
        run: ./.venv/bin/python -m mypy src tests
      - name: pytest
        run: ./.venv/bin/python -m pytest -q
      - name: report reproduces from committed results
        run: ./.venv/bin/python -m decision_tier report > /dev/null
